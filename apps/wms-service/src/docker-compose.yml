version: '3.8'

services:
  wms-db:
    image: postgres:16-alpine
    container_name: cashos-wms-db
    environment:
      POSTGRES_DB: cashos_wms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - wms-db-data:/var/lib/postgresql/data

  wms-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cashos-wms-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  wms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cashos-wms-api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=wms-db;Port=5432;Database=cashos_wms;Username=postgres;Password=postgres"
      RabbitMQ__HostName: wms-rabbitmq
    depends_on:
      - wms-db
      - wms-rabbitmq

volumes:
  wms-db-data:
