version: '3.9'

services:
  # ─────────────────────────────────────────────────
  #  PostgreSQL 16
  # ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chetka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chetka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chetka_secret}
      POSTGRES_DB: ${POSTGRES_DB:-chetka_db}
      POSTGRES_MULTIPLE_DATABASES: chetka_db,chetka_wms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - chetka_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chetka} -d ${POSTGRES_DB:-chetka_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  #  Redis 7
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chetka_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chetka_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────
  #  RabbitMQ 3.13 (с Management UI)
  # ─────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: chetka_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-chetka}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitmq_secret}
      RABBITMQ_DEFAULT_VHOST: chetka_vhost
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - chetka_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─────────────────────────────────────────────────
  #  Backend (NestJS)
  # ─────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: chetka_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-chetka}:${POSTGRES_PASSWORD:-chetka_secret}@postgres:5432/${POSTGRES_DB:-chetka_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-chetka}:${RABBITMQ_PASSWORD:-rabbitmq_secret}@rabbitmq:5672/chetka_vhost
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_CHANGE_IN_PRODUCTION}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_CHANGE_IN_PRODUCTION}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    networks:
      - chetka_network
    volumes:
      - ./apps/backend:/app
      - /app/node_modules

  # ─────────────────────────────────────────────────
  #  WMS Service (.NET 8)
  # ─────────────────────────────────────────────────
  wms-service:
    build:
      context: ./apps/wms-service
      dockerfile: Dockerfile
    container_name: chetka_wms
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=chetka_wms;Username=${POSTGRES_USER:-chetka};Password=${POSTGRES_PASSWORD:-chetka_secret}"
      RabbitMQ__HostName: rabbitmq
      RabbitMQ__UserName: ${RABBITMQ_USER:-chetka}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-rabbitmq_secret}
      RabbitMQ__VirtualHost: chetka_vhost
      RabbitMQ__Port: 5672
    ports:
      - "5000:8080"
    networks:
      - chetka_network

volumes:
  postgres_data:
    name: chetka_postgres_data
  redis_data:
    name: chetka_redis_data
  rabbitmq_data:
    name: chetka_rabbitmq_data

networks:
  chetka_network:
    name: chetka_network
    driver: bridge
